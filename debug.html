<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Padel Admin - Debug</title>
</head>
<body style="font-family:Arial;padding:20px;background:#f0f0f0;">

<h2>Schritt 1: JavaScript Test</h2>
<p id="js-test" style="color:red;">JavaScript laeuft NICHT</p>

<h2>Schritt 2: Button Test</h2>
<button type="button" id="testbtn" style="padding:12px 24px;background:#1a4a7a;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer;">
  Klick mich
</button>
<p id="btn-result" style="margin-top:10px;color:#555;">Noch nicht geklickt</p>

<h2>Schritt 3: localStorage Test</h2>
<button type="button" id="savebtn" style="padding:12px 24px;background:#2e7ab8;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer;">
  Wert speichern
</button>
<p id="save-result" style="margin-top:10px;color:#555;">-</p>

<h2>Schritt 4: Fehlerlog</h2>
<div id="errlog" style="background:#fff;border:1px solid #ccc;padding:10px;min-height:60px;font-size:13px;font-family:monospace;white-space:pre;"></div>

<script>
// Fehler abfangen
window.onerror = function(msg, src, line, col, err) {
  var log = document.getElementById('errlog');
  log.textContent += 'FEHLER Zeile ' + line + ': ' + msg + '\n';
  return false;
};

// JS laeuft Test
document.getElementById('js-test').textContent = 'JavaScript laeuft! ✓';
document.getElementById('js-test').style.color = 'green';

// Button Test
document.getElementById('testbtn').onclick = function() {
  document.getElementById('btn-result').textContent = 'Button wurde geklickt! ✓';
  document.getElementById('btn-result').style.color = 'green';
};

// localStorage Test
document.getElementById('savebtn').onclick = function() {
  try {
    localStorage.setItem('test', 'funktioniert');
    var val = localStorage.getItem('test');
    document.getElementById('save-result').textContent = 'Gespeichert und gelesen: ' + val + ' ✓';
    document.getElementById('save-result').style.color = 'green';
  } catch(e) {
    document.getElementById('save-result').textContent = 'FEHLER: ' + e.message;
    document.getElementById('save-result').style.color = 'red';
  }
};

document.getElementById('errlog').textContent = 'Kein Fehler bisher.';
</script>
</body>
</html>
